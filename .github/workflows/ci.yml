name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend CI (Java 21 / Spring Boot / JUnit 5)
  # ============================================================================
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Run Backend Test Suite
        run: mvn -B clean test
        env:
          SPRING_PROFILES_ACTIVE: test

  # ============================================================================
  # Job 2: Frontend CI (Node.js 20 / TypeScript / Vite)
  # ============================================================================
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production SPA (TypeScript & Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

  # ============================================================================
  # Job 3: Docker & Compose Validation
  # ============================================================================
  docker-ci:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: resolveai-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: false
          load: true
          tags: resolveai-frontend:ci-check
