# ==============================================================================
# ResolveAI — Local PostgreSQL Development Environment (Phase 2)
# ==============================================================================
# Usage:
#   docker compose up -d
#   docker compose down
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resolveai_db}
      POSTGRES_USER: ${DB_USERNAME:-${DB_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-${DB_USER:-postgres}} -d ${DB_NAME:-resolveai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: resolveai_postgres_data
