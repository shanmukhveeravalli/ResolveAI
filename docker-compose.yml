# ==============================================================================
# ResolveAI — Production-Ready Multi-Container Stack (Phase 14 / Phase 16)
# ==============================================================================
# Services:
#   - postgres: PostgreSQL 16 + pgvector relational database with persistent volume
#   - redis: Redis 7 in-memory cache & rate limiter with AOF persistence
#   - backend: Spring Boot 3 / Java 21 modular monolith backend API
#   - frontend: React 18 / TypeScript / Vite production SPA served by Nginx
#
# Architecture Note:
#   - Container-to-container communication uses the internal bridge network
#     (resolveai-network).
#   - Frontend (Nginx) reverse-proxies /api/* to http://backend:8080/api/*.
#   - Frontend port 80 is the only publicly published application port.
#   - Backend port 8080 is exposed on the internal network only (not published
#     to the host), avoiding host port conflicts (e.g. Jenkins on 8080).
#   - PostgreSQL (5432) and Redis (6379) ports are published for local dev;
#     remove or restrict those ports in production for security.
#   - For production, supply all secrets via environment variables or a secrets
#     manager — never commit real values to source control.
#
# Local Dev Quick Start:
#   cp .env.example .env          # configure as needed
#   docker compose up --build -d
#   docker compose ps             # verify all 4 containers are healthy
#
# Production:
#   docker compose --env-file .env.prod up -d
#
# Useful commands:
#   docker compose logs -f
#   docker compose down           # preserves volumes
#   docker compose down -v        # removes volumes (destructive!)
# ==============================================================================

name: resolveai

services:
  # ----------------------------------------------------------------------------
  # Database Service: PostgreSQL 16 with pgvector extension (Phase 11-12)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resolveai_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resolveai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-resolveai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # In-Memory Cache Service: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: resolveai-redis
    restart: unless-stopped
    # When REDIS_PASSWORD is set (non-empty), Redis is started with --requirepass.
    # An empty REDIS_PASSWORD (local dev default) starts Redis without auth.
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
        else
          redis-server --appendonly yes
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - resolveai-network
    healthcheck:
      # redis-cli ping works without auth when REDIS_PASSWORD is empty;
      # with a password, Redis would return NOAUTH — using --no-auth-warning for clean output
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Backend API Service: Spring Boot 3 / Java 21
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: resolveai-backend:0.1.0
    container_name: resolveai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-resolveai_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-c2VjdXJlX2VudGVycHJpc2VfamF2YV8yMV9zcHJpbmdfYm9vdF9qd3Rfc2VjcmV0X2tleV9leGFtcGxl}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173,http://localhost:3000,http://frontend:80}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI_TOP_K: ${AI_TOP_K:-5}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT: ${AI_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      ACTUATOR_HEALTH_SHOW_DETAILS: ${ACTUATOR_HEALTH_SHOW_DETAILS:-when_authorized}
      DB_SSL_MODE: ${DB_SSL_MODE:-prefer}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
    expose:
      - "8080"
    networks:
      - resolveai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Frontend SPA Service: React / Vite / Nginx
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: resolveai-frontend:0.1.0
    container_name: resolveai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - resolveai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  resolveai-network:
    name: resolveai-network
    driver: bridge

volumes:
  postgres_data:
    name: resolveai_postgres_data
  redis_data:
    name: resolveai_redis_data
