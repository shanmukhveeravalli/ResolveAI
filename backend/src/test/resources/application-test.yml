server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:resolveai_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false

resolveai:
  cors:
    allowed-origins: "*"
